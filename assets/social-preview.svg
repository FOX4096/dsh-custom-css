<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">dsh-custom-css 社交预览卡</title>
  <desc id="desc">深色渐变底 + 图标 + 仓库名与一句话说明</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="640" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b5a41"/>
      <stop offset="0.45" stop-color="#1c5265"/>
      <stop offset="0.75" stop-color="#263f83"/>
      <stop offset="1" stop-color="#3d2e79"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.16" cy="0.22" r="0.55">
      <stop offset="0" stop-color="#2f9e6e" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2f9e6e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.88" cy="0.85" r="0.6">
      <stop offset="0" stop-color="#7b5cf0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7b5cf0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#257b56"/>
      <stop offset="0.35" stop-color="#257083"/>
      <stop offset="0.68" stop-color="#3156af"/>
      <stop offset="1" stop-color="#6048bb"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glowA)"/>
  <rect width="1280" height="640" fill="url(#glowB)"/>

  <!-- 图标（与 assets/icon.svg 同一套构图，等比放大到 232×232） -->
  <g transform="translate(84, 204) scale(0.4531)">
    <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#iconBg)"/>
    <rect x="1.5" y="1.5" width="509" height="509" rx="115" fill="none" stroke="#000000" stroke-opacity="0.18" stroke-width="3"/>
    <path d="M 206 138 C 179 138 167 153 167 180 L 167 214 C 167 240 160 251 133 256 C 160 261 167 272 167 298 L 167 332 C 167 359 179 374 206 374"
          fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#ffffff">
      <rect x="254" y="186" width="141" height="32" rx="16"/>
      <rect x="254" y="240" width="108" height="32" rx="16" fill-opacity="0.9"/>
      <rect x="254" y="294" width="76" height="32" rx="16" fill-opacity="0.78"/>
    </g>
  </g>

  <!-- 文案 -->
  <g font-family="Segoe UI, Microsoft YaHei, Hiragino Sans GB, sans-serif">
    <text x="372" y="298" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">dsh-custom-css</text>
    <rect x="374" y="322" width="132" height="7" rx="3.5" fill="#ffffff" fill-opacity="0.42"/>
    <text x="374" y="392" font-size="34" font-weight="600" fill="#eaf2f7" fill-opacity="0.95">设置行里的自定义 CSS 编辑器</text>
    <text x="374" y="446" font-size="24" fill="#d3e3ec" fill-opacity="0.82">写完即生效 · 样式表就是磁盘上的 .css 文件</text>
    <text x="374" y="492" font-size="22" fill="#c3d7e3" fill-opacity="0.62">即时生效 · DevTools 风格编辑器 · 键入补全 · 规则面板 · 格式校验</text>
    <text x="1196" y="574" font-size="20" fill="#ffffff" fill-opacity="0.5" text-anchor="end">DSH 0.1.5-rc.1+ · MIT</text>
  </g>
</svg>
