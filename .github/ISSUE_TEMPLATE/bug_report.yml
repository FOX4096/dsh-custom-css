name: Bug 报告
description: 插件没按预期工作（样式不生效、面板异常、报错等）
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请尽量把下面填全 —— 这个插件的行为高度依赖 DSH 版本与当时的样式表内容。

        > 安全相关的问题请**不要**开公开 Issue，走 [SECURITY.md](../SECURITY.md) 里的私密渠道。
  - type: input
    id: dsh-version
    attributes:
      label: DSH 版本
      description: 在设置里能看到，或运行 `dsh --version`
      placeholder: 0.1.5-rc.1
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: npm 包版本，或仓库里的提交号（`git rev-parse --short HEAD`）
      placeholder: 0.1.3
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: 安装方式
      options:
        - npm（dsh plugin --profile web add dsh-custom-css）
        - GitHub（dsh plugin --profile web add github:FOX4096/dsh-custom-css）
        - 本机 link: 开发安装
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 设置 → 通用 → 自定义 CSS
        2. …
        3. 看到 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望与实际
      description: 期望发生什么、实际发生了什么
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: 浏览器控制台报错（如果有）
      description: 直接粘贴原文即可；DSH 的插件加载失败通常也在这里
      render: text
  - type: textarea
    id: sheet
    attributes:
      label: 相关样式表片段（可选）
      description: 能触发问题的最小片段。注意不要贴任何凭据
      render: css
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已经在**最新版本**上复现过
          required: true
        - label: 如果改过 `lib/index.js`（host 半），我已经**重启过 dsh**
          required: false
