name: Publish

# 走 npm 的「受信发布者（Trusted Publishing）」：GitHub Actions 用 OIDC 直接向
# registry 证明身份，不再需要 NPM_TOKEN 之类的长期写权限凭据，也不会弹 2FA。
#
# 0.1.0 是 2026-09-13 用本机 `npm publish` + 浏览器 OTP 首发的 —— 受信发布者只能给
# **已存在**的包配置，所以第一次发布绕不开传统方式。包已经在 registry 上了，tag 触发
# 随之打开：
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# ⚠ 唯一前置：先在 npmjs.com 给这个包配好受信发布者 ——
#   包页面 → Settings → Trusted Publisher → GitHub Actions：
#     Organization or user = FOX4096
#     Repository            = dsh-custom-css
#     Workflow filename     = publish.yml
#     Environment           =（留空）
#   没配好就推 tag，发布步骤会以 401/404 失败。
# Actions 页面手动 Run workflow 走同一条 OIDC 路径，前置条件相同。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 凭据：受信发布必需，替代 NPM_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # setup-node 带的 npm 可能低于受信发布要求的版本（需 11.5.1+）
      - name: 升级 npm
        run: npm install -g npm@latest

      - name: 测试
        run: |
          node --version
          npm --version
          npm test

      - name: 发布（带 provenance 签名）
        run: npm publish --provenance --access public
