name: Publish

# 走 npm 的「受信发布者（Trusted Publishing）」：GitHub Actions 用 OIDC 直接向
# registry 证明身份，不再需要 NPM_TOKEN 之类的长期写权限凭据，也不会弹 2FA。
#
# 0.1.1 起这条路已经走通：推 v* tag → 本文件 → registry 上出现带 provenance 证明的
# 版本（在 attestation 里能读到 workflow ref、commit 与 run id）。0.1.0 是本机
# `npm publish` + 浏览器 OTP 发的 —— 受信发布者只能给**已存在**的包配置，所以第一次
# 发布绕不开传统方式。
#
# 用法：
#   git tag v0.2.0 && git push origin v0.2.0
# 或在 Actions 页面手动 Run workflow（同一条 OIDC 路径）。
# 前置：npmjs.com 上该包 Settings → Trusted Publisher 已填
#   Organization or user = FOX4096 / Repository = dsh-custom-css /
#   Workflow filename = publish.yml / Environment 留空
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布成功后要用同一个 tag 建 Release 并上传附件
      id-token: write # OIDC 凭据：受信发布必需，替代 NPM_TOKEN
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # setup-node 带的 npm 可能低于受信发布要求的版本（需 11.5.1+）
      - name: 升级 npm
        run: npm install -g npm@latest

      - name: 测试
        run: |
          node --version
          npm --version
          npm test

      # tag 与 package.json 必须说同一件事。不一致时：tag 落后 → npm 报「版本已存在」
      # 而 Release 建不出来；package.json 超前 → registry 上是新版本，Release 却挂在旧
      # tag 上、附件也是新版本的 tarball。两种都只会在发完之后才被发现。
      - name: 校验 tag 与包版本一致
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "tag $GITHUB_REF_NAME 与 package.json 的 $VERSION 不一致" >&2
            exit 1
          fi

      # 幂等：版本已经在 registry 上时不算失败。
      #
      # 这不是防御性代码，是踩出来的：把 v0.2.0 那个 tag 移到修复提交之后，tag 重新推送
      # 又触发了一次本工作流，`npm publish` 报「You cannot publish over the previously
      # published versions」而失败 —— 于是后面**建 Release 与传附件两步全被跳过**，
      # 而这两步在「源码动了、需要重新生成产物」时恰恰是要跑的。
      #
      # 所以判据是「registry 上有没有这个版本」，不是「publish 命令成不成功」。
      #
      # 预发布版本不能落到 latest：v0.2.0-rc.1 会把 latest 指过去，所有人
      # npm i 装到的就是候选版。
      - name: 发布（带 provenance 签名）
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "dsh-custom-css@$VERSION" version >/dev/null 2>&1; then
            echo "registry 上已有 $VERSION —— 跳过发布，继续建 Release / 传附件"
            exit 0
          fi
          case "$VERSION" in
            *-*) npm publish --provenance --access public --tag next ;;
            *)   npm publish --provenance --access public ;;
          esac

      # 只有 tag 触发才建 Release。发布说明取 CHANGELOG 里对应版本的那一段 ——
      # 默认的 --generate-notes 只会给一行 "Full Changelog"，等于没有说明。
      #
      # `--draft=false`：v0.1.4～v0.1.8 都是公开的，v0.2.0 却停在 Draft 上 —— 说明
      # 依赖默认值并不稳定（仓库的「默认创建为草稿」设置、或 `gh` 自身的行为都会影响它）。
      # 发布流程的产物该是公开的，所以写死，不再依赖默认。
      #
      # 幂等：Release 已存在就只打印提示，交给人工维护。
      - name: 建 GitHub Release（发布说明取自 CHANGELOG）
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## " v " ") == 1 { capture = 1; print; next }
            capture && index($0, "## ") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "发布说明取自 CHANGELOG：$(wc -l < release-notes.md) 行"
          else
            echo "CHANGELOG 里没有 $VERSION 的段落"
          fi

          # `--draft` 让 view 也能看到草稿：只看已发布的会漏掉上次运行留下的草稿，
          # 于是这里会以为「不存在」而再去 create 一次并失败。
          NOTES=()
          if [ -s release-notes.md ]; then NOTES=(--notes-file release-notes.md); fi
          if gh release view "$GITHUB_REF_NAME" --draft >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，只更新说明与公开状态"
            gh release edit "$GITHUB_REF_NAME" --draft=false "${NOTES[@]}"
          elif [ -s release-notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --draft=false --title "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" --draft=false --title "$GITHUB_REF_NAME" --generate-notes
          fi

      # 把刚发布到 npm 的那个 tarball 附到 Release 上：registry 与 Release 页
      # 指向同一个产物（字节一致），下载与校验都不用再去 registry 找。
      #
      # 从 registry 取、而不是就地 `npm pack`：两者本该一致，但 `npm pack` 会带上
      # 工作区的 .npmignore/files 解析差异，而这里要的是「registry 上那一个的副本」——
      # 从 registry 下载就天然保证了这一点。
      - name: 附上 npm tarball（取自 registry）
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          npm pack "dsh-custom-css@$VERSION"
          gh release upload "$GITHUB_REF_NAME" dsh-custom-css-*.tgz --clobber
