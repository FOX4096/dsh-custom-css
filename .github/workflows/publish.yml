name: Publish

# 走 npm 的「受信发布者（Trusted Publishing）」：GitHub Actions 用 OIDC 直接向
# registry 证明身份，不再需要 NPM_TOKEN 之类的长期写权限凭据，也不会弹 2FA。
#
# 为什么默认只留手动触发：受信发布者要在 npmjs.com 上给**已存在的包**配置
# （Settings → Trusted Publisher，填本仓库 + 本文件名），所以第一次发布仍然得用
# 传统方式（本机 `npm publish` + 一次 OTP）。配好之后把下面的 tag 触发打开即可：
#
#   push:
#     tags: ['v*']
#
# 触发方式保持不变时，也可以在 GitHub 的 Actions 页面手动 Run workflow。
on:
  workflow_dispatch:
  # push:
  #   tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC 凭据：受信发布必需，替代 NPM_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # setup-node 带的 npm 可能低于受信发布要求的版本（需 11.5.1+）
      - name: 升级 npm
        run: npm install -g npm@latest

      - name: 测试
        run: |
          node --version
          npm --version
          npm test

      - name: 发布（带 provenance 签名）
        run: npm publish --provenance --access public
