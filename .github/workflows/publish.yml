name: Publish

# 走 npm 的「受信发布者（Trusted Publishing）」：GitHub Actions 用 OIDC 直接向
# registry 证明身份，不再需要 NPM_TOKEN 之类的长期写权限凭据，也不会弹 2FA。
#
# 0.1.1（2026-09-13）已经走通这条路：推 v* tag → 本文件 → registry 上出现带
# provenance 证明的版本（在 attestation 里能读到 workflow ref、commit 与 run id）。
# 0.1.0 是本机 `npm publish` + 浏览器 OTP 发的 —— 受信发布者只能给**已存在**的包
# 配置，所以第一次发布绕不开传统方式。
#
# 用法：
#   git tag v0.2.0 && git push origin v0.2.0
# 或在 Actions 页面手动 Run workflow（同一条 OIDC 路径）。
# 前置：npmjs.com 上该包 Settings → Trusted Publisher 已填
#   Organization or user = FOX4096 / Repository = dsh-custom-css /
#   Workflow filename = publish.yml / Environment 留空
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 发布成功后要用同一个 tag 建 Release
      id-token: write # OIDC 凭据：受信发布必需，替代 NPM_TOKEN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # setup-node 带的 npm 可能低于受信发布要求的版本（需 11.5.1+）
      - name: 升级 npm
        run: npm install -g npm@latest

      - name: 测试
        run: |
          node --version
          npm --version
          npm test

      - name: 发布（带 provenance 签名）
        run: npm publish --provenance --access public

      # 只有 tag 触发才建 Release；幂等 —— 已存在就跳过，不覆盖人工补充的说明
      - name: 建 GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在，跳过"
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
