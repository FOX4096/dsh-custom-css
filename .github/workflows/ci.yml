name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 本插件没有构建步骤、也没有运行时依赖：lib/*.js 就是产物，
# 所以 CI 只做「语法自检 + 两套冒烟测试」，几秒跑完。
jobs:
  test:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # plugin 支持 Node ≥ 20（DSH 自身的要求）
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: 语法自检
        run: |
          node --check lib/client.js
          node --check lib/index.js
          node --check tests/loader-smoke.cjs
          node --check tests/host-api-smoke.mjs
          node --check tests/audit-docs.mjs
          node --check tests/audit-skin.mjs
          node --check tests/update-compat.mjs

      - name: host 侧文件接口冒烟测试
        run: node tests/host-api-smoke.mjs

      - name: 浏览器半冒烟测试（含校验器回归）
        run: node tests/loader-smoke.cjs

      # 巡检脚本本身只报告、不改退出码（本地跑一次不该让 shell 红），所以门禁靠 --enforce。
      # 「一个只打印的输出在流水线里等于不存在」—— 这一条是给它加开关的理由。
      - name: 令牌与可访问名巡检
        run: |
          npm run audit
          node tests/audit-accessible-names.mjs --enforce

      # 文档巡检也是双份：链接与孤儿文档靠 npm run audit，而它是**非 enforce** 的
      # （本地跑不该红），所以这里单独用 --enforce 把 README 里那四处自动维护锚点
      # 也变成门禁 —— 那些锚点丢了会让 compat:update 每 6 小时打印一次告警而没人看，
      # 文档就从此悄悄过期。
      - name: 文档链接与锚点巡检
        run: node tests/audit-docs.mjs --enforce

      # 换代门禁：断言我们依赖的平台契约（槽位 settings.general.item + dsh.client.inject
      # 的两个 id）在目标 DSH 版本里仍然存在。需要网络访问 npm registry（要拉各版本的包），
      # 所以在矩阵里只跑一档；DSH 换代改名时它会先红，而不是等用户看到模块表报错。
      - name: 跨版本兼容断言
        if: matrix.node == '22'
        run: npm run compat
